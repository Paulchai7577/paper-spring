<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0612"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0612;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}</style><title>紙彈簧暗夜歌德城堡</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Serif+TC:wght@500;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one full-bleed canvas stage, a quiet HUD, and centered title / game-over cards */
:root{
  color-scheme:dark;
  --night:#0b0612;
  --blood:#c21f3f;
  --wax:#f3c35a;
  --mist:#b8c3e3;
  --bone:#efe5d6;
  --ink:#1a0e24;
  --display:"Pirata One","Noto Serif TC",Georgia,serif;
  --han:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--bone);overflow:hidden;font-family:var(--han)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}
.score{display:flex;flex-direction:column;gap:2px}
.score b{font-family:var(--display);font-weight:400;font-size:60px;line-height:.9;color:var(--bone);text-shadow:0 0 22px rgba(194,31,63,.75),0 2px 0 #000;font-variant-numeric:tabular-nums}
.score small{font-size:12px;letter-spacing:.2em;color:var(--mist);opacity:.8}
.mute{pointer-events:auto;font:500 13px var(--han);letter-spacing:.12em;color:var(--mist);background:rgba(11,6,18,.55);border:1px solid rgba(184,195,227,.35);border-radius:999px;padding:8px 14px;cursor:pointer}
.mute:focus-visible,button:focus-visible{outline:2px solid var(--wax);outline-offset:3px}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;pointer-events:none;font-size:15px;letter-spacing:.3em;color:var(--mist);text-shadow:0 0 10px #000;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.overlay{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 45%,rgba(11,6,18,.25),rgba(11,6,18,.88) 70%)}
.card{text-align:center;max-width:430px;display:flex;flex-direction:column;align-items:center;gap:14px}
.eyebrow{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.35em;color:var(--blood);text-shadow:0 0 12px rgba(194,31,63,.6)}
h1,h2{margin:0;text-wrap:balance}
.latin{display:block;font-family:var(--display);font-weight:400;font-size:clamp(52px,15vw,84px);line-height:.95;color:var(--bone);text-shadow:0 0 28px rgba(194,31,63,.8),0 0 2px #fff}
.han{display:block;margin-top:8px;font-weight:900;font-size:clamp(22px,6vw,28px);letter-spacing:.18em;color:var(--wax);text-shadow:0 0 16px rgba(243,195,90,.5)}
h2{font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:.12em;color:var(--bone);text-shadow:0 0 22px rgba(194,31,63,.85)}
.lead{margin:0;font-size:16px;line-height:1.8;color:var(--bone);opacity:.88;max-width:34ch}
.how{list-style:none;margin:4px 0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--mist);letter-spacing:.06em}
.how li::before{content:"✝  ";color:var(--blood)}
.stat{margin:0;font-size:17px;color:var(--mist)}
.stat b{font-family:var(--display);font-weight:400;font-size:44px;color:var(--wax);vertical-align:-6px;padding:0 6px;font-variant-numeric:tabular-nums}
.go{margin-top:8px;font:900 19px var(--han);letter-spacing:.14em;padding:15px 34px;border:0;border-radius:999px;color:var(--ink);background:linear-gradient(180deg,#ffe29a,var(--wax) 45%,#c9822a);box-shadow:0 0 34px rgba(243,195,90,.5),inset 0 -3px 0 rgba(0,0,0,.2);cursor:pointer}
.go.alt{background:transparent;box-shadow:none;color:var(--wax);border:1px solid rgba(243,195,90,.5);font-size:14px;padding:9px 24px;margin-top:10px;letter-spacing:.08em}
.go:active{transform:translateY(1px)}
.best{margin:0;font-size:13px;letter-spacing:.2em;color:var(--mist);opacity:.75}
.lb{list-style:none;margin:0;padding:0;width:100%;max-width:300px;font-size:14px;color:var(--mist);display:flex;flex-direction:column;gap:4px}
.lb:empty{display:none}
.lb li{display:flex;gap:10px;padding:5px 12px;border-radius:10px;background:rgba(20,10,34,.6);border:1px solid rgba(243,195,90,.18)}
.lb li b{width:20px;color:var(--wax);font-weight:900}.lb li span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb li i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--bone)}
.lb li.me{border-color:var(--wax);background:rgba(60,30,90,.7)}
.lbt{margin:0;font-size:12px;letter-spacing:.3em;color:var(--wax)}.lbt[hidden]{display:none}
.nick{width:100%;max-width:220px;text-align:center;font:700 16px var(--han);padding:9px 12px;border-radius:999px;border:1px solid rgba(243,195,90,.4);background:rgba(20,10,34,.7);color:var(--bone)}
.nick::placeholder{color:var(--mist);opacity:.6}
.card{gap:10px}@media(max-height:760px){.lead{display:none}}
.show{display:flex;align-items:center;gap:6px;width:100%;max-width:340px;padding:6px 12px 6px 6px;border-radius:20px;background:rgba(20,10,34,.55);border:1px solid rgba(243,195,90,.25);box-sizing:border-box}
.show canvas{width:92px;height:106px;flex:none;position:static}
.info{text-align:left;min-width:0;flex:1}
.info b{font:900 16px var(--han);color:var(--wax);letter-spacing:.08em}
.info ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px;font-size:12px;color:var(--mist);line-height:1.35}
.info li span{color:var(--wax);font-weight:700;margin-right:6px}
.pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:320px;margin-left:auto;margin-right:auto}
.chip{width:56px;height:70px;padding:0;border-radius:18px;border:2px solid rgba(243,195,90,.25);background:rgba(20,10,34,.55);cursor:pointer;opacity:.6;transition:.15s}
.chip canvas{position:static;width:100%;height:100%;display:block;pointer-events:none}
.chip.on{opacity:1;border-color:var(--wax);background:rgba(70,34,104,.7);box-shadow:0 0 22px rgba(243,195,90,.45)}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
</style>

<canvas id="c" aria-label="紙彈簧遊戲畫面"></canvas>

<div class="hud">
  <div class="score"><b id="sc">0</b><small>跳過的城垛</small></div>
  <button class="mute" id="mute" type="button">聲音 開</button>
</div>
<div class="hint" id="hint" hidden>按住壓彈簧 · 放開起跳</div>

<div class="overlay" id="title">
  <div class="card">
    <p class="eyebrow">MIDNIGHT · XII</p>
    <h1><span class="latin">The Paper Spring</span><span class="han">紙彈簧・暗夜歌德城堡</span></h1>
    <p class="lead">她把白紙摺成彈簧，塗上紫色。等大家都睡著，她踩著它，跳過一座又一座城垛。</p>
    <div class="show"><canvas id="showC" width="200" height="232"></canvas><div class="info"><b id="sName"></b><ul id="sList"></ul></div></div>
    <div class="pick" role="radiogroup" aria-label="選角色"><button type="button" class="chip on" data-c="girl" aria-label="小女孩"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="ghost" aria-label="彩色幽靈"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="bride" aria-label="鬼新娘"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="lord" aria-label="軍閥大佬"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="mom" aria-label="撐傘的媽媽"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="gege" aria-label="格格"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="fairy" aria-label="仙子"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="pk" aria-label="跑酷猛男"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="dad" aria-label="三寶爸"><canvas width="120" height="140"></canvas></button><button type="button" class="chip" data-c="yogi" aria-label="Yogi de Vickie"><canvas width="120" height="140"></canvas></button></div>
    <button class="go" id="start" type="button">點亮蠟燭，出發</button>
    <ul class="how">
      <li>按住畫面，把彈簧壓緊</li>
      <li>放開，起跳</li>
      <li>踩中蠟燭，燭火轉金、連擊加分</li>
    </ul>
    <p class="best" id="bestT"></p>
    <p class="lbt" id="lbtT" hidden>排行榜</p><ol class="lb" id="lbT"></ol>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <p class="eyebrow">THE FOG HAS EYES</p>
    <h2>霧裡的眼睛睜開了</h2>
    <p class="stat">這次跳過<b id="final">0</b>座城垛</p>
    <p class="best" id="bestO"></p>
    <input class="nick" id="nick" maxlength="10" placeholder="你的暱稱（上排行榜）" hidden>
    <p class="lbt" id="lbtO" hidden>排行榜</p><ol class="lb" id="lbO"></ol>
    <button class="go" id="pick" type="button">選擇角色</button>
    <button class="go alt" id="again" type="button">再跳一次（同角色）</button>
  </div>
</div>

  function br(x,y,a,len,d){const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;segs.push([x,y,x2,y2,d]);if(d<=0)return;
    const n=r()<.5?2:3;for(let j=0;j<n;j++)br(x2,y2,a+(r()-.5)*1.4,len*(.55+r()*.2),d-1)}

/* ---------- spring (her folded paper, crayon yellow + orange) ---------- */
const SPN=5;const scrib=Array.from({length:SPN},(_,i)=>{const r=rng(i*53+11),col=(i%2)?'#f2c6ff':'#e9d9ff',pts=[];
  const lines=[];for(let l=0;l<3;l++){const a=[];let u=r()*.2,v=.1+r()*.2;for(let k=0;k<9;k++){a.push([u,v]);u=Math.min(.95,u+.06+r()*.1);v=k%2?.12+r()*.2:.7+r()*.2}lines.push(a)}
  return{col,lines,col2:(i%2)?'#ffd57a':'#ff9ed8'}});
function drawSpring(x,yb,h){const w=46,sk=3+Math.max(0,46-h)*.28;const folds=[];
  for(let i=0;i<=SPN;i++){const s=(i%2?1:-1)*sk;folds.push({y:yb-h*i/SPN,l:x-w/2+s,r:x+w/2+s})}
  // warm glow: she is the only warm light in the night
  const g=ctx.createRadialGradient(x,yb-h/2,4,x,yb-h/2,110);g.addColorStop(0,'rgba(190,130,255,.35)');g.addColorStop(1,'rgba(190,130,255,0)');ctx.fillStyle=g;ctx.fillRect(x-120,yb-h/2-120,240,240);
  for(let i=0;i<SPN;i++){const a=folds[i],b=folds[i+1];ctx.save();ctx.beginPath();ctx.moveTo(a.l,a.y);ctx.lineTo(a.r,a.y);ctx.lineTo(b.r,b.y);ctx.lineTo(b.l,b.y);ctx.closePath();
    ctx.fillStyle=i%2?'#7b4fbf':'#a97be6';ctx.fill();ctx.clip();
    const sc=scrib[i];ctx.lineWidth=1.3;ctx.lineJoin='round';
    sc.lines.forEach((ln,li)=>{ctx.strokeStyle=li===2?sc.col2:sc.col;ctx.globalAlpha=.85;ctx.beginPath();
      ln.forEach(([u,v],k)=>{const L=lerp(a.l,b.l,v),Rr=lerp(a.r,b.r,v),px=L+(Rr-L)*u,py=lerp(a.y,b.y,v);k?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()});
    ctx.globalAlpha=1;
    const sh=ctx.createLinearGradient(0,a.y,0,b.y);sh.addColorStop(0,i%2?'rgba(40,20,50,.18)':'rgba(255,255,255,0)');sh.addColorStop(1,i%2?'rgba(255,255,255,0)':'rgba(40,20,50,.16)');ctx.fillStyle=sh;ctx.fillRect(x-60,b.y,120,a.y-b.y);

  return folds[SPN].y}

  nick.addEventListener('change',()=>{if(last>0)save(last)});

  // ---- full ranking viewer (anyone with the link can open it)
  const stl=document.createElement('style');stl.textContent='.lbbtn{margin:2px 0;padding:8px 20px;border-radius:999px;border:1px solid rgba(243,195,90,.5);background:rgba(20,10,34,.55);color:var(--wax);font:700 14px var(--han);letter-spacing:.14em;cursor:pointer}.lbbtn:active{transform:translateY(1px)}#lbAll{z-index:50;background:rgba(11,6,18,.985)}#lbAll .card{max-height:100%;width:100%}#lbAll .lb{max-width:340px;max-height:58vh;overflow:auto;-webkit-overflow-scrolling:touch}#lbAll .lb li.t1 b{color:#ffd76a}#lbM{margin:0;font-size:14px;color:var(--mist)}#lbA li i{margin-left:auto}';document.head.append(stl);
  const ov=document.createElement('div');ov.className='overlay';ov.id='lbAll';ov.hidden=true;
  ov.innerHTML='<div class="card"><p class="eyebrow">HALL OF THE BRAVE</p><h2>城堡排行榜</h2><p id="lbM"></p><ol class="lb" id="lbA"></ol><button class="go alt" id="lbX" type="button">關閉</button></div>';
  document.body.append(ov);
  async function openAll(){
    ov.hidden=false;const ol=$('lbA'),m=$('lbM');ol.textContent='';m.textContent='載入中…';
    try{const r=await fetch(U+'/rest/v1/leaderboard?select=name,score&limit=100',{headers:H});if(!r.ok)throw 0;const rows=await r.json();
      m.textContent=rows.length?'共 '+rows.length+' 位玩家上榜':'還沒有人上榜，成為第一個吧！';
      const mine=myName();
      rows.forEach((v,i)=>{const li=document.createElement('li');if(i<3)li.className='t1';if(v.name===mine&&v.score===best)li.classList.add('me');
        const a=document.createElement('b'),b=document.createElement('span'),c=document.createElement('i');
        a.textContent=i+1;b.textContent=String(v.name||'無名氏').slice(0,10);c.textContent=(+v.score||0)+' 座';li.append(a,b,c);ol.append(li)})
    }catch(e){m.textContent='排行榜暫時連不上，請稍後再試'}}
  $('lbX').onclick=()=>{ov.hidden=true};
  for(const id of['start','bestO']){const b=document.createElement('button');b.type='button';b.className='lbbtn';b.textContent='🏆 查看全部排名';b.onclick=openAll;$(id).after(b)}
  load();
})();
})();
</script>
</body></html>
